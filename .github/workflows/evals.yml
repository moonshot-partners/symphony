name: evals

on:
  pull_request:
    paths:
      - 'elixir/lib/symphony_elixir/**'
      - 'elixir/lib/mix/tasks/symphony.eval.ex'
      - 'evals/**'

jobs:
  evals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install deps (PR head)
        run: mix deps.get

      - name: Record candidate (PR head)
        run: mix symphony.eval --record --output /tmp/candidate.jsonl --dataset ../evals/dataset

      - name: Record baseline (origin/${{ github.base_ref }})
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git worktree add /tmp/baseline-tree origin/${{ github.base_ref }}
          cd /tmp/baseline-tree/elixir
          mix deps.get
          mix symphony.eval --record --output /tmp/baseline.jsonl --dataset ../evals/dataset

      - name: Diff (baseline vs candidate)
        run: mix symphony.eval --diff --baseline /tmp/baseline.jsonl --candidate /tmp/candidate.jsonl
